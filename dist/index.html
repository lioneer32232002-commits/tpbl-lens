<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <title>TPBL-Lens｜全聯盟分析總覽 2025-26</title>
  <meta name="description" content="TPBL 2025-26 全聯盟排名、效率比較、得分來源分析">
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pangu@4.0.7/dist/browser/pangu.min.js" defer></script>
<style>
  :root {
    --bg:      #0f1923;
    --bg2:     #1a2a3a;
    --bg3:     #243447;
    --accent:  #00e5ff;
    --accent2: #f06292;
    --text:    #e8edf2;
    --text2:   #8fa3b8;
    --border:  rgba(0,229,255,.18);
    --hm-p3:   #0077b6;
    --hm-p2:   #0096c7;
    --hm-p1:   #90e0ef;
    --hm-z:    #374e5e;
    --hm-n1:   #f48fb1;
    --hm-n2:   #ec407a;
    --hm-n3:   #d81b60;
    --hm-null: #1a2a3a;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; line-height: 1.6; }
  /* NAV */
  header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 1.5rem; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,.4); }
  nav { max-width: 960px; margin: 0 auto; display: flex; align-items: center; gap: 1rem; height: 56px; }
  .logo { color: var(--accent); font-weight: 900; font-size: 1.1rem; text-decoration: none; white-space: nowrap; letter-spacing: .05em; }
  .nav-links { display: flex; gap: .2rem; overflow-x: auto; }
  .nav-links a { color: var(--text2); text-decoration: none; padding: .3rem .65rem; border-radius: 6px; font-size: .84rem; white-space: nowrap; transition: background .15s, color .15s; }
  .nav-links a:hover, .nav-links a.active { background: var(--bg3); color: var(--accent); }
  /* LAYOUT */
  main { max-width: 960px; margin: 0 auto; padding: 1.5rem; }
  section { margin-bottom: 2.5rem; }
  h2 { font-size: 1.05rem; font-weight: 700; color: var(--accent); margin-bottom: 1rem; border-left: 3px solid var(--accent); padding-left: .75rem; }
  /* CARDS */
  .card { background: var(--bg2); border-radius: 10px; padding: 1.25rem; border: 1px solid var(--border); }
  /* TABLES */
  table { width: 100%; border-collapse: collapse; font-size: .87rem; }
  th { color: var(--text2); font-weight: 700; text-align: left; padding: .5rem .75rem; border-bottom: 1px solid var(--bg3); white-space: nowrap; }
  td { padding: .42rem .75rem; border-bottom: 1px solid rgba(255,255,255,.04); white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  tr.highlight td { color: var(--accent); font-weight: 700; }
  tr.playoff-cut td { border-bottom: 2px solid var(--accent2); }
  /* RANK PILLS */
  .rank-pill { display: inline-block; width: 22px; height: 22px; border-radius: 50%; line-height: 22px; text-align: center; font-size: .74rem; font-weight: 700; }
  .r-in  { background: var(--accent);  color: #000; }
  .r-pi  { background: var(--accent2); color: #000; }
  .r-out { background: var(--bg3);     color: var(--text2); }
  /* CHARTS */
  .chart-wrap { position: relative; }
  .chart-wrap canvas { max-width: 100%; }
  /* HEATMAP */
  .heatmap-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .heatmap-table { border-collapse: separate; border-spacing: 3px; font-size: .82rem; }
  .heatmap-table th { color: var(--text2); font-size: .76rem; padding: .3rem .5rem; }
  .heatmap-table th:first-child { text-align: left; }
  .hm-name { padding: .4rem .75rem; color: var(--text); font-weight: 700; background: var(--bg2); border-radius: 4px; white-space: nowrap; width: 1%; }
  .hm-cell { width: 60px; height: 34px; border-radius: 5px; text-align: center; font-weight: 700; font-size: .8rem; vertical-align: middle; white-space: nowrap; word-break: keep-all; }
  .hm-p3   { background: var(--hm-p3); color: #fff; }
  .hm-p2   { background: var(--hm-p2); color: #fff; }
  .hm-p1   { background: var(--hm-p1); color: #0a1520; }
  .hm-z    { background: var(--hm-z);  color: #8fa3b8; }
  .hm-n1   { background: var(--hm-n1); color: #0a1520; }
  .hm-n2   { background: var(--hm-n2); color: #fff; }
  .hm-n3   { background: var(--hm-n3); color: #fff; }
  .hm-null { background: var(--hm-null); color: var(--text2); }
  /* PROB BARS */
  .prob-row { margin-bottom: .75rem; }
  .prob-row label { display: flex; justify-content: space-between; margin-bottom: .3rem; font-size: .87rem; color: var(--text2); }
  .prob-row label strong { color: var(--text); }
  .pct-val { color: var(--accent); font-weight: 700; }
  .prob-bar-bg { background: var(--bg3); border-radius: 4px; height: 10px; overflow: hidden; }
  .prob-bar-fill { height: 100%; border-radius: 4px; transition: width 1s ease; background: var(--accent); }
  .bar-ch { background: #ffd700; }
  /* VS CARDS */
  .vs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: .6rem; }
  .vs-card { background: var(--bg2); border-radius: 8px; padding: .65rem .5rem; border: 1px solid var(--border); text-align: center; }
  .vs-card .vs-name { font-size: .78rem; color: var(--text2); margin-bottom: .25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vs-record { font-size: 1.05rem; font-weight: 900; white-space: nowrap; }
  .vs-record .w { color: var(--accent); }
  .vs-record .l { color: var(--text2); }
  .vs-record .sep { color: var(--text2); margin: 0 .15rem; font-weight: 700; }
  .vs-meta { font-size: .72rem; color: var(--text2); margin-top: .2rem; white-space: nowrap; }
  /* MHU STAT SMALL MULTIPLES */
  .mw-stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: .75rem; margin-top: .75rem; }
  .mw-stat-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: .6rem .65rem; text-align: center; }
  .mw-stat-head { display: flex; justify-content: center; align-items: center; gap: .35rem; margin-bottom: .15rem; }
  .mw-stat-name { font-weight: 700; font-size: .84rem; color: var(--text); }
  .mw-sig  { font-size: .68rem; background: rgba(0,212,255,.15); color: var(--accent); border-radius: 4px; padding: .1rem .3rem; }
  .mw-trend{ font-size: .68rem; background: rgba(240,98,146,.12); color: var(--accent2); border-radius: 4px; padding: .1rem .3rem; }
  .mw-stat-meta { font-size: .7rem; color: var(--text2); margin-bottom: .35rem; }
  /* canvas 正方形容器 */
  .mw-canvas-wrap { position: relative; aspect-ratio: 1/1; }
  .mw-canvas-wrap canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
  .mw-medians { font-size: .72rem; margin-top: .35rem; line-height: 1.65; }
  /* DATA TABLE: center non-first columns */
  .data-nums th:not(:first-child),
  .data-nums td:not(:first-child) { text-align: center; }
  /* PACE SMALL MULTIPLES */
  .pace-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: .65rem; }
  .pace-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: .55rem .6rem; }
  .pace-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .15rem; }
  .pace-name { font-weight: 700; font-size: .82rem; color: var(--text); }
  .pace-avg { font-size: .78rem; color: var(--accent); font-weight: 700; }
  .pace-meta { font-size: .68rem; color: var(--text2); margin-top: .2rem; display: flex; justify-content: space-between; }
  .pace-card canvas { display: block; max-width: 100%; }
  /* FOOTER */
  footer { background: var(--bg2); border-top: 1px solid var(--border); padding: 1.25rem 1.5rem; text-align: center; color: var(--text2); font-size: .82rem; margin-top: 3rem; }
  footer a { color: var(--accent); text-decoration: none; }
  /* RESPONSIVE */
  @media (max-width: 600px) {
    main { padding: 1rem; }
    nav { gap: .5rem; }
    h2 { font-size: .95rem; }
    .hm-cell { width: 48px; height: 30px; font-size: .72rem; }
    .hm-name { font-size: .72rem; padding: .3rem .4rem; }
    table { font-size: .8rem; }
    th, td { padding: .35rem .4rem; white-space: nowrap; }
    .card { padding: .85rem; }
    .vs-grid { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: .45rem; }
    .vs-card { padding: .5rem .35rem; }
    .vs-record { font-size: .95rem; }
    .vs-card .vs-name { font-size: .7rem; }
    .vs-meta { font-size: .66rem; }
    /* 主客場 mobile：隱藏 "場/勝/敗" 單位，只留數字 */
    .ha-unit { display: none; }
    .ha-wl .ha-sep::before { content: "-"; color: var(--text2); margin: 0 .15rem; }
    .ha-wl { white-space: nowrap; }
    /* 滑動提示 */
    .heatmap-wrap { position: relative; }
    .heatmap-wrap::after { content: "← 左右滑動 →"; display: block; text-align: center; font-size: .68rem; color: var(--text2); margin-top: .4rem; }
    /* pace small multiples: 兩欄 */
    .pace-grid { grid-template-columns: repeat(2, 1fr); }
    .mw-stat-grid { grid-template-columns: repeat(2, 1fr); gap: .5rem; }
  }
</style>

</head>
<body>
<header>
  <nav aria-label="主選單">
    <a class="logo" href="/">TPBL-Lens</a>
    <div class="nav-links">
      <a href="/">總覽</a>
      <a href="/formosa/">夢想家</a>
      <a href="/lions/">攻城獅</a>
      <a href="/aquas/">海神</a>
      <a href="/leopards/">雲豹</a>
      <a href="/braves/">特攻</a>
      <a href="/kings/">國王</a>
      <a href="/warriors/">戰神</a>
    </div>
  </nav>
</header>

<main>
  <section id="standings">
    <h2>聯盟排名</h2>
    <div class="card">
      <table>
        <thead><tr><th style="text-align:center">#</th><th>球隊</th><th style="text-align:center">勝</th><th style="text-align:center">敗</th><th style="text-align:center">勝率</th></tr></thead>
        <tbody id="standings-body"></tbody>
      </table>
    </div>
  </section>

  <section id="league-rtg">
    <h2>每百回合效率</h2>
    <div class="card chart-wrap"><canvas id="chart-rtg" style="max-height:340px"></canvas></div>
  </section>

  <section id="scoring-sources">
    <h2>得分來源比較</h2>
    <div class="card chart-wrap"><canvas id="chart-scoring" style="max-height:300px"></canvas></div>
  </section>

  <section id="team-cards">
    <h2>各隊分析入口</h2>
    <div id="team-cards-grid" class="vs-grid"></div>
  </section>

  <section id="style-clusters">
    <h2>球隊風格分群</h2>
    <div id="style-clusters-content" class="card"></div>
  </section>

  <section id="matchup-matrix">
    <h2>對戰矩陣</h2>
    <div class="card">
      <div class="heatmap-wrap">
        <table class="heatmap-table" id="matchup-table"></table>
      </div>
    </div>
  </section>

  <section id="pace-trend">
    <h2>節奏趨勢（每場回合數）</h2>
    <div class="card">
      <div id="pace-grid" class="pace-grid"></div>
      <div id="pace-summary" style="font-size:.74rem;color:var(--text2);margin-top:.75rem"></div>
    </div>
  </section>

</main>
<footer>
  <p>TPBL-Lens — 全聯盟中性分析平台 · 資料來源：<a href="https://tpbl.basketball" target="_blank" rel="noopener">tpbl.basketball</a></p>
  <p style="margin-top:.35rem">本站為非官方獨立分析，不代表任何球隊立場</p>
</footer>

<script src="/js/league.js"></script>
</body>
</html>
